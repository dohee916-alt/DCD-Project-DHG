name: Assemble DCD uploaded sound recordings
on:
  push:
    paths:
      - ".github/workflows/assemble-dcd-sounds.yml"
      - "assets/audio/dcd-fashion-loop-part*.txt"
      - "assets/audio/dcd-fixed-sfx-part*.txt"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate exact recorded source audio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib
          root=Path('assets/audio')
          samples=[
            ('dcd-fashion-loop-part','dcd-fashion-loop.ogg',5,10756,0x149052bf),
            ('dcd-fixed-sfx-part','dcd-fixed-sfx.ogg',8,19493,0xc7e34773)
          ]
          for prefix,target,count,expected,checksum in samples:
            encoded=''.join((root/f'{prefix}{i}.txt').read_text().strip() for i in range(1,count+1))
            raw=base64.b64decode(encoded,validate=True)
            if len(raw)!=expected or zlib.crc32(raw)!=checksum:
              raise SystemExit(f'Audio data invalid: {target}, bytes={len(raw)}, crc={hex(zlib.crc32(raw))}')
            (root/target).write_bytes(raw)
            print(f'VALID {target}: {len(raw)} bytes, crc={hex(checksum)}')
          PY
      - name: Commit website-compatible binary audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/dcd-fashion-loop.ogg assets/audio/dcd-fixed-sfx.ogg
          if ! git diff --cached --quiet; then
            git commit -m "Install validated user-supplied DCD audio loops and sound effects"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
