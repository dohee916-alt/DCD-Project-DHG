name: Extract first frame for stable intro GIF loading
on:
  push:
    paths:
      - .github/workflows/extract-blister-loop-first.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save exact first frame of current approved squeeze loop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('assets/motion/blister_3_to_5_1_23_pingpong.gif')
          dst=Path('assets/motion/blister_3_to_5_1_23_pingpong_first.png')
          with Image.open(src) as im:
              assert im.n_frames==44 and im.size==(540,1080)
              im.seek(0)
              im.convert('RGBA').save(dst)
          print('Created unchanged opening frame',dst)
          PY
      - name: Commit static frame for seamless GIF loading
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/motion/blister_3_to_5_1_23_pingpong_first.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add exact static first frame for seamless opening GIF load'
            git push origin HEAD:main
          fi
